<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
</head>
<body style="margin:0">
<title>Du schon wieder!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Lilita+One&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: eine Handy-Spalte (max. 440px), jede Ansicht füllt sie ganz; Büro, Bar und Schreibtisch als Bühnenbilder, darüber Cartoon-Panels mit dicker Kontur. */
:root{
  --night:#1C1838; --night-2:#2A2357; --deep:#100C20; --ink:#141022;
  --paper:#FFF6E5; --paper-2:#EFE3CC; --paper-3:#E3D6BE;
  --gold:#F5B82E; --gold-dark:#8A4A0A; --teal:#2BB5A8; --pink:#F06A9B; --red:#E2463F; --violet:#8E7BE0; --plum:#8E2F5C;
  --text:#1A1530; --text-2:#3D3350; --muted:#5A4E6E; --soft:#CFC6E4; --soft-2:#E6DFF2;
  --ok:#2BB5A8; --bad:#E2463F;
  --display:'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif;
  --body:'Nunito', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--deep);background-image:radial-gradient(circle at 20% 10%,#2A2357 0,transparent 45%),radial-gradient(circle at 80% 90%,#3A1E3C 0,transparent 40%);font-family:var(--body);color:var(--paper);-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{position:relative;height:100%;max-width:440px;margin:0 auto;overflow:hidden;background:var(--night);box-shadow:0 0 0 1px rgba(255,246,229,.06),0 20px 60px rgba(0,0,0,.5)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.pad{padding:16px}
.h1{font-family:var(--display);font-size:30px;line-height:1.05;color:var(--paper);margin:0;font-weight:400;text-wrap:balance}
.h2{font-family:var(--display);font-size:22px;line-height:1.1;margin:0;font-weight:400;text-wrap:balance}
.label{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.sub{font-size:14px;font-weight:700;color:var(--soft)}

/* Panels & Buttons */
.panel{background:var(--paper);color:var(--text);border:3px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 18px;border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);background:var(--gold);color:var(--ink);font-family:var(--display);font-size:20px;text-decoration:none;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{background:#6E6589;color:#2A2440;cursor:not-allowed}
.btn.light{background:var(--paper);font-family:var(--body);font-weight:800;font-size:15px;min-height:46px}
.btn.ghost{background:transparent;border-color:rgba(255,246,229,.35);box-shadow:none;color:var(--paper);font-family:var(--body);font-weight:800;font-size:14px;min-height:44px}
.icon-btn{width:46px;height:46px;flex-shrink:0;border-radius:50%;border:3px solid var(--ink);background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--ink);padding:0}
.chip{text-shadow:none;-webkit-text-stroke:0;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:2px solid var(--ink);font-weight:800;font-size:12px;color:var(--ink)}
.disc{border-radius:50%;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.face{border-radius:50%;border:3px solid var(--ink);object-fit:cover;flex-shrink:0;background:var(--night-2)}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:rgba(255,246,229,.12)}
.tab{min-height:44px;border-radius:10px;border:2px solid transparent;background:transparent;color:var(--soft);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.tab[aria-selected="true"]{background:var(--paper);border-color:var(--ink);color:var(--text);font-weight:800}
.count{padding:0 7px;border-radius:999px;background:var(--red);border:2px solid var(--ink);font-size:11px;font-weight:800;color:var(--paper)}

/* Navigation */
.nav{flex-shrink:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--ink);padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--soft);font-size:12px;font-weight:700;min-height:52px;justify-content:center}
.nav button[aria-current="page"]{color:var(--gold);font-weight:800}

/* Start */
.start .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,12,32,.85) 0,rgba(16,12,32,.3) 34%,rgba(16,12,32,.25) 50%,rgba(16,12,32,.9) 74%,var(--deep) 86%)}
.logo{position:relative;display:flex;flex-direction:column;align-items:center;transform:rotate(-4deg);margin-top:max(36px,6vh)}
.logo svg{display:block;width:min(310px,82vw);height:auto;overflow:visible;filter:drop-shadow(0 6px 0 #141022)}
.logo text{font-family:var(--display);paint-order:stroke fill;stroke:#141022;stroke-linejoin:round}
.tag{margin-top:14px;padding:5px 14px;border-radius:999px;background:var(--ink);border:2px solid var(--gold);font-weight:800;font-size:13px;color:var(--paper);transform:rotate(4deg)}
.cast{position:relative;flex:1;min-height:180px}
.cast img{position:absolute;bottom:0;object-fit:contain;object-position:bottom}
.start-actions{position:relative;padding:0 24px 12px;display:flex;flex-direction:column;gap:10px}
.foot{position:relative;padding:6px 20px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:11px;font-weight:700;color:var(--soft)}
.eu{display:flex;align-items:center;gap:8px;color:var(--soft-2)}

/* Tutorial & Mentor-Bühne */
.stage-bg{position:absolute;inset:0 0 auto 0;height:62%;background:url(img/bar.webp) center/cover}
.stage-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,12,32,.55) 0,rgba(16,12,32,.25) 45%,rgba(28,24,56,.95) 82%,var(--night) 100%)}
.progress{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;flex:1}
.progress span{height:8px;border-radius:999px;border:2px solid var(--ink);background:rgba(255,246,229,.25)}
.progress span.on{background:var(--gold)}
.speaker{position:relative;display:flex;align-items:flex-end;gap:8px;min-height:250px}
.speaker .who{align-self:flex-start;padding:3px 12px;border-radius:999px;background:var(--plum);border:2px solid var(--ink);font-weight:800;font-size:12px;color:var(--paper)}
.bubble{background:var(--paper);color:var(--text);border:3px solid var(--ink);border-radius:6px 20px 20px 20px;box-shadow:0 4px 0 var(--ink);padding:12px 14px;font-size:15px;line-height:1.42;font-weight:700}
.mentor-img{position:absolute;right:-8px;bottom:0;width:52%;max-height:300px;object-fit:contain;object-position:bottom right;pointer-events:none}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 16px;border-radius:16px;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);background:var(--paper);color:var(--text);font-weight:800;font-size:15px;line-height:1.3;text-align:left}
.opt[aria-pressed="true"]{background:var(--gold)}
.radio{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink);background:#fff;flex-shrink:0}
.opt[aria-pressed="true"] .radio{background:var(--ink)}
.field{min-height:52px;width:100%;padding:0 16px;border-radius:14px;border:3px solid var(--ink);background:var(--paper);box-shadow:0 3px 0 var(--ink);font-family:var(--display);font-size:20px;color:var(--text)}
.avatars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.avatars button{aspect-ratio:1;padding:0;border-radius:50%;border:3px solid var(--ink);background:none;overflow:hidden}
.avatars button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 3px var(--ink)}
.avatars img{width:100%;height:100%;object-fit:cover;display:block}

/* Hub */
.office{position:relative;aspect-ratio:1024/800;overflow:hidden;flex-shrink:0}
.office .bg{position:absolute;left:0;top:-22.5%;width:100%}
.office .lamp{position:absolute;left:12%;top:41%;height:27%;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.office::after{content:"";position:absolute;inset:auto 0 0 0;height:42%;background:linear-gradient(180deg,rgba(28,24,56,0),var(--night));pointer-events:none}
.topbar{position:absolute;left:12px;right:12px;top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:2}
.pill{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;box-shadow:0 4px 0 var(--ink);color:var(--text)}
.pill img{width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);object-fit:cover}
.bar{display:block;width:110px;height:8px;border-radius:999px;background:var(--paper-3);border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.score{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--ink);border-radius:999px;font-weight:800;font-size:14px}
.hub-body{position:relative;margin-top:-56px;padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;z-index:1}
.carousel{position:relative;padding:0 26px}
.ccard{position:relative;padding:16px;display:flex;flex-direction:column;gap:10px;touch-action:pan-y}
.ccard.anim{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
.peek{position:absolute;top:14px;bottom:14px;width:40px;background:var(--paper-2);border:3px solid var(--ink);border-radius:20px;opacity:.65}
.arrow{position:absolute;top:50%;margin-top:-23px;width:46px;height:46px;border-radius:50%;background:var(--ink);border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;padding:0;z-index:2}
.dots{display:flex;justify-content:center;gap:8px}
.dots button{height:12px;width:12px;padding:0;border-radius:999px;border:2px solid var(--ink);background:var(--soft)}
.dots button[aria-pressed="true"]{width:30px;background:var(--gold)}
.waiting{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.wait{flex-shrink:0;width:74px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.wait .sil{width:52px;height:52px;border-radius:50%;border:3px dashed rgba(255,246,229,.4);background:rgba(255,246,229,.06);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.wait b{font-size:11px;line-height:1.2;color:var(--soft-2)}
.wait span{font-size:10px;color:var(--soft);font-weight:700}
.banner{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;background:rgba(255,246,229,.1);border:2px solid var(--gold)}

/* Case */
.scene{position:relative;flex-shrink:0;width:100%;aspect-ratio:1024/640;overflow:hidden}
.scene-in{position:absolute;left:0;top:-59.4%;width:100%;aspect-ratio:1024/1536}
.scene-in .bg,.scene-in .desk{position:absolute;left:0;width:100%}
.scene-in .bg{top:0;height:100%}
.scene-in .desk{top:63.3%}
.scene-in .npc{position:absolute;left:50%;bottom:36.2%;height:34%;transform:translateX(-50%);object-fit:contain;object-position:bottom;transition:transform .2s}
.npc.bump{animation:bump .35s ease-out}
@keyframes bump{30%{transform:translateX(-50%) translateY(-8px) rotate(-2deg)}}
.case-top{position:absolute;left:12px;right:12px;top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:2}
.case-title{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.case-title .h2{text-shadow:0 2px 0 var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.log{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 6px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%;animation:msg .25s ease-out}
@keyframes msg{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.msg .face{width:34px;height:34px;border-width:2px}
.msg .b{padding:10px 13px;border-radius:18px 18px 18px 6px;border:3px solid var(--ink);background:var(--paper);color:var(--text);font-size:15px;line-height:1.4;font-weight:700}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .b{border-radius:18px 18px 6px 18px;background:var(--gold)}
.msg.tip .b{background:#2E2552;color:var(--paper);border-color:var(--gold);font-size:14px}
.msg.tip .b strong{color:var(--gold)}
.msg.note{align-self:center;max-width:100%}
.msg.note .b{background:transparent;color:var(--soft-2);border:2px dashed rgba(255,246,229,.35);border-radius:12px;font-size:13px;text-align:center}
.typing .b{display:flex;gap:4px;padding:14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}
.prop{align-self:center;width:88%;animation:msg .3s ease-out}
.prop.chat{background:#0E1A2B;border:3px solid var(--ink);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 0 var(--ink)}
.prop.chat .hd{font-size:11px;font-weight:800;color:#8FB3D9;letter-spacing:.04em}
.prop.chat p{margin:0;align-self:flex-start;background:#22344F;color:#E7F0FA;padding:7px 10px;border-radius:12px 12px 12px 4px;font-size:13px;font-weight:700}
.prop.ad{background:linear-gradient(135deg,#FF8CC0,#F06A9B);border:3px solid var(--ink);border-radius:16px;padding:12px;color:var(--ink);box-shadow:0 4px 0 var(--ink);transform:rotate(-1.5deg)}
.prop.ad b{font-family:var(--display);font-size:20px;font-weight:400;display:block}
.prop.ad p{margin:4px 0 0;font-weight:800;font-size:14px}
.prop.ad p.fine{font-size:10px;opacity:.75;font-weight:700}
.prop.paper{background:#FFFDF6;color:var(--text);border:2px solid var(--ink);border-radius:4px;padding:12px 14px;box-shadow:2px 4px 0 rgba(0,0,0,.4);font-weight:700;font-size:14px;transform:rotate(1deg)}
.prop.paper b{display:block;font-family:var(--display);font-weight:400;font-size:17px;margin-bottom:4px}
.prop.paper p{margin:2px 0;display:flex;justify-content:space-between;border-bottom:1px dashed #CDBFA6;padding-bottom:2px;font-variant-numeric:tabular-nums}
.prop.paper p:last-child{border:0;font-weight:800}
.choices{flex-shrink:0;padding:8px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,rgba(28,24,56,0),var(--night) 14px)}
.choices .opt{font-size:14px;min-height:48px;padding:8px 14px}
.choices .opt:active{background:var(--gold)}

/* Challenge */
.ch-head{display:flex;gap:10px;align-items:flex-start}
.ch-head .face{width:46px;height:46px}
.bins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bin{min-height:150px;padding:10px;border-radius:18px;background:rgba(255,246,229,.1);border:3px solid;display:flex;flex-direction:column;gap:8px;text-align:left;color:var(--paper)}
.bin.target{background:rgba(245,184,46,.18);border-style:dashed}
.bin h3{margin:0;font-family:var(--display);font-weight:400;font-size:18px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.bin h3 small{font-family:var(--body);font-weight:800;font-size:12px;color:var(--soft)}
.note{display:block;width:100%;padding:9px 10px;background:#FFFDF6;color:var(--text);border:2px solid var(--ink);border-radius:4px;box-shadow:0 3px 0 var(--ink);font-size:13px;line-height:1.3;font-weight:700;text-align:left;user-select:none;-webkit-user-select:none}
.note .amt{display:block;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.pool .note{touch-action:none}
.note.sel{outline:3px solid var(--gold);outline-offset:2px;transform:rotate(-2deg)}
.note.right{background:#D7F5EF;border-color:#14695F}
.note.wrong{background:#FFD9D6;border-color:#9E1F18}
.note .mark{float:right;font-weight:800}
.pool{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ghost{position:fixed;z-index:50;pointer-events:none;width:160px;transform:rotate(-5deg);box-shadow:0 14px 24px rgba(0,0,0,.45);border-color:var(--gold)}
.budget{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:14px;background:rgba(255,246,229,.08);border:2px solid rgba(255,246,229,.2)}
.budget .track{position:relative;height:16px;border-radius:999px;border:2px solid var(--ink);background:var(--paper-3);overflow:hidden;display:flex}
.budget .track i{display:block;height:100%}
.budget .brow{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--soft-2);font-variant-numeric:tabular-nums}
.msgs{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:18px;background:#0E1A2B;border:3px solid var(--ink)}
.msgs .hd{font-size:12px;font-weight:800;color:#8FB3D9}
.cmsg{align-self:flex-start;max-width:92%;text-align:left;padding:9px 12px;border-radius:14px 14px 14px 4px;background:#22344F;color:#E7F0FA;border:3px solid transparent;font-size:14px;font-weight:700;display:flex;gap:8px;align-items:flex-start}
.cmsg[aria-pressed="true"]{border-color:var(--red);background:#3A2433}
.cmsg .flag{flex-shrink:0;width:20px;height:20px;border-radius:50%;border:2px solid #8FB3D9;display:flex;align-items:center;justify-content:center}
.cmsg[aria-pressed="true"] .flag{background:var(--red);border-color:var(--red)}
.cmsg .why{display:block;font-size:11px;font-weight:800;margin-top:3px}
.cmsg.right{border-color:var(--teal)}
.cmsg.wrong{border-color:var(--red)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.vcard{padding:10px 12px;border-radius:14px;background:var(--paper);color:var(--text);border:3px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-weight:800;font-size:14px}
.vcard.hl{background:#FFD3E6}
.vcard b{font-family:var(--display);font-weight:400;font-size:17px;font-variant-numeric:tabular-nums}
.big{font-family:var(--display);font-size:52px;line-height:1;text-align:center;font-variant-numeric:tabular-nums;color:var(--gold);text-shadow:0 4px 0 var(--ink)}
input[type=range]{width:100%;height:44px;accent-color:var(--gold)}
.verdict{padding:12px 14px;border-radius:16px;font-weight:800;font-size:14px;line-height:1.4;border:3px solid var(--ink)}

/* Outcome & Level */
.out{background:radial-gradient(circle at 50% 28%,#3A2E6E 0,var(--night) 70%)}
.stage{align-self:center;padding:4px 14px;border-radius:999px;border:2px solid var(--ink);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.hero-img{display:block;margin:0 auto;height:220px;max-width:80%;object-fit:contain;object-position:bottom}
.hero-img.mentor{height:240px}
.plus{padding:4px 12px;border-radius:999px;background:var(--gold);border:2px solid var(--ink);font-family:var(--display);font-size:18px;color:var(--ink);animation:plus .6s ease-out}
@keyframes plus{0%{transform:scale(.3)}60%{transform:scale(1.25)}100%{transform:none}}
.lamps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lamps button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px;border-radius:16px;border:3px solid var(--paper-3);background:#fff;color:var(--text);font-weight:800;font-size:12px}
.lamps button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--gold)}
.lamps span{width:100%;height:76px;border-radius:12px;background:var(--night-2);display:flex;align-items:center;justify-content:center}
.lamps img{height:64px;width:80%;object-fit:contain}

/* Mentor, Akten, Snippets, Skills */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 14px;border-radius:16px;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);background:var(--paper);color:var(--text);text-align:left;width:100%}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .t b{font-size:15px;font-weight:800}

.akte .k{font-family:'Courier New',monospace;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#6B5D4A}

.step{display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:14px;line-height:1.35}

.board{border:6px solid #6B4130;border-radius:14px;box-shadow:0 4px 0 var(--ink),inset 0 0 0 2px var(--ink);background-color:#B9824A;background-image:radial-gradient(rgba(90,52,28,.35) 1px,transparent 1.6px),radial-gradient(rgba(255,230,190,.18) 1px,transparent 1.6px);background-size:9px 9px,13px 13px;background-position:0 0,4px 6px;padding:16px 10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 10px}
.snip{position:relative;padding:18px 10px 10px;border:2px solid var(--ink);box-shadow:2px 4px 0 rgba(20,16,34,.55);color:var(--text);display:flex;flex-direction:column;gap:6px}
.snip:nth-child(odd){transform:rotate(-1.5deg)}.snip:nth-child(even){transform:rotate(1.5deg)}
.snip .pin{position:absolute;left:50%;top:-7px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2px solid var(--ink)}
.snip .txt{font-family:'Caveat','Comic Sans MS','Segoe Print',cursive;font-weight:800;font-size:17px;line-height:1.15}
.snip .tp{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.snip.empty{background:rgba(255,246,229,.18);border-style:dashed;box-shadow:none;transform:none;color:var(--ink);font-weight:800;font-size:12px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filters button{flex-shrink:0;display:flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:2px solid rgba(255,246,229,.3);background:rgba(255,246,229,.12);color:var(--soft-2);font-weight:700;font-size:13px}
.filters button[aria-pressed="true"]{background:var(--paper);border-color:var(--ink);color:var(--text);font-weight:800;box-shadow:0 3px 0 var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px 10px;text-align:center}
.tile .ring{position:relative;width:76px;height:76px}
.tile .ring > svg{position:absolute;inset:0;transform:rotate(-90deg)}
.tile .ring .disc{position:absolute;left:15px;top:15px;width:46px;height:46px}
.tile b{font-size:13px;line-height:1.2}
.tile .v{font-family:var(--display);font-size:20px;line-height:1}
.tile small{font-size:11px;font-weight:700;color:var(--muted)}
.hist{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;align-items:end;height:104px}
.hist div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:104px}
.hist i{display:block;width:100%;border:2px solid var(--ink);border-radius:5px 5px 2px 2px;background:var(--soft)}

.trk{position:relative;display:block;height:10px;border-radius:999px;background:var(--paper-3);border:2px solid var(--ink)}
.trk .a{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:#A99FBF}
.trk .m{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2px solid var(--ink)}

/* ---------- Case: Challenge ---------- */

  return '<div class="screen"><div class="scroll"><div class="pad" style="display:flex;flex-direction:column;gap:14px">' +
    '<button class="btn ghost" style="align-self:flex-start" data-a="go" data-to="hub">' + ic('left', 18) + 'Büro</button>' +
    '<div style="display:flex;align-items:center;gap:14px"><img class="face" src="' + AV[st.av] + '" alt="Dein Profilbild" style="width:76px;height:76px;box-shadow:0 4px 0 var(--ink)"><div style="flex:1;display:flex;flex-direction:column;gap:6px"><span class="h1" style="font-size:28px">' + esc(nm()) + '</span><span class="sub" style="font-size:13px">Level ' + lv + (na ? ' · noch ' + (na - s) + ' bis Level ' + (lv + 1) : ' · höchstes Level im Prototyp') + '</span></div></div>' +
    '<div class="cards"><div class="panel" style="padding:12px 14px"><span class="h2" style="font-size:28px">' + p + ' / ' + C.cases.length + '</span><br><span style="font-size:13px;font-weight:700;color:var(--muted)">Fälle gespielt</span></div><div class="panel" style="padding:12px 14px"><span class="h2" style="font-size:28px">' + (p ? Math.round(100 * s / p) : 0) + ' %</span><br><span style="font-size:13px;font-weight:700;color:var(--muted)">davon gelöst</span></div></div>' +
    '<label class="label" for="pf-name">Spitzname</label><div style="display:flex;gap:8px"><input id="pf-name" class="field" maxlength="16" autocomplete="off" value="' + esc(st.name) + '"><button class="btn light" data-a="pf-save" style="flex-shrink:0">Speichern</button></div>' +
    '<span class="label">Profilbild</span><div class="avatars">' + AV.map(function (src, i) { return '<button data-a="av" data-i="' + i + '" aria-pressed="' + (st.av === i) + '" aria-label="Profilbild ' + (i + 1) + '"><img src="' + src + '" alt=""></button>'; }).join('') + '</div>' +
    '<div class="panel" style="padding:14px;display:flex;flex-direction:column;gap:8px"><b>Datenschutz</b><span style="font-size:13px;line-height:1.45;font-weight:600;color:var(--text-2)">Dein Spielstand wird nur auf diesem Gerät gespeichert. Es werden keine Daten an uns oder an Dritte geschickt.</span></div>' +
    (ui.confirm ? '<div class="panel" style="padding:14px;display:flex;flex-direction:column;gap:10px;border-color:var(--red)"><b>Wirklich alles zurücksetzen?</b><span style="font-size:13px;font-weight:600;color:var(--text-2)">Name, Fortschritt und Snippets werden gelöscht. Das Tutorial startet neu.</span><div style="display:flex;gap:8px"><button class="btn light" style="flex:1" data-a="reset-no">Abbrechen</button><button class="btn" style="flex:1;background:var(--red);color:var(--paper);font-size:16px" data-a="reset-yes">Zurücksetzen</button></div></div>' : '<button class="btn ghost" data-a="reset">' + ic('retry', 16) + 'Spielstand zurücksetzen</button>') +
    '<div class="banner" style="border-color:rgba(255,246,229,.25)">' + ic('info', 18, '#F5B82E') + '<span style="font-size:13px;line-height:1.45;font-weight:600;color:var(--soft-2)">„Du schon wieder!“ ist ein Spiel und keine Finanzberatung. Im echten Leben können Geldentscheidungen ernste Folgen haben – frag im Zweifel Menschen, denen du vertraust.</span></div>' +
    '<span class="sub" style="font-size:11px;text-align:center">Kofinanziert von der Europäischen Union · ' + esc(C.version) + '</span>' +
    '</div></div></div>';
}

/* ---------- Overlays ---------- */
function ov(html, center) { closeOv(); var d = document.createElement('div'); d.className = 'ov' + (center ? ' center' : ''); d.id = 'ov'; d.innerHTML = html; app.appendChild(d); var f = d.querySelector('button'); if (f) f.focus(); }
function closeOv() { var d = document.getElementById('ov'); if (d) d.remove(); }
function sheetSnips() {
  var list = C.snippets.filter(function (s) { return st.snips.indexOf(s.id) >= 0; });
  ov('<div class="sheet" role="dialog" aria-label="Snippets"><div style="display:flex;justify-content:space-between;align-items:center"><span class="h2">Deine Snippets</span><button class="icon-btn" data-a="close" aria-label="Schließen">' + ic('x', 18) + '</button></div><div class="scroll"><div class="board">' + (list.length ? list.map(snipCard).join('') : '<div class="snip empty">Noch keine Snippets.</div>') + '</div></div></div>');
}
var HINTS = {
  hub: 'Willkommen in der Garage. Unten wartet deine erste Kundschaft. Später kommen mehr – dann suchst du dir aus, wem du zuerst hilfst.',
  mentor: 'Hier bin ich, wenn du mich brauchst. Trainings erklären dir ein Thema. Im Aktenschrank liegen deine verpatzten Fälle – mit Lösung.',
  snips: 'Deine Spickzettel. Nach jedem Fall gibt’s einen neuen. Mitten im Gespräch kommst du über die Glühbirne oben rechts dran.',
  skills: 'Hier siehst du, welche Themen du draufhast. Unter „Vergleich“ siehst du, wo du im Durchschnitt stehst. Anonym.'
};
function hint(key) {
  if (st.hints.indexOf(key) >= 0) return;
  st.hints.push(key); save();
  later(function () {
    ov('<div class="panel dlg" role="dialog" aria-label="Hinweis der Mentorin"><div style="display:flex;gap:10px;align-items:center"><img class="face" src="img/face_mentor.webp" alt="" style="width:52px;height:52px"><span class="h2" style="font-size:19px">Kurz erklärt</span></div><p style="margin:0;font-size:15px;line-height:1.45;font-weight:700">' + esc(HINTS[key]) + '</p><button class="btn" data-a="close">Verstanden</button></div>', true);
  }, 350);
}
function toast(t) { var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; app.appendChild(d); setTimeout(function () { d.remove(); }, 1600); }

/* ---------- Render ---------- */
function render() {
  var v = { start: vStart, tut: vTut, hub: vHub, case: vCase, chal: vChal, out: vOut, lvl: vLvl, mentor: vMentor, train: vTrain, akten: vAkten, snips: vSnips, skills: vSkills, profile: vProfile }[ui.s];
  app.innerHTML = v();
  if (ui.s === 'hub') { bindSwipe(); hint('hub'); }
  if (ui.s === 'mentor' || ui.s === 'snips' || ui.s === 'skills') hint(ui.s);
  if (ui.s === 'chal') bindChal();
  ui.anim = false;
}
function startCase(id) {
  run = { id: id, i: 0, mood: 'neutral', fast: false, tipsSeen: run && run.tipsSeen || st.plays > 0 };
  ui = { s: 'case' }; clearTimers(); closeOv(); render();
  var c = caseById(id);
  var l = logEl(); l.addEventListener('click', function () { run.fast = true; });
  later(step, 500);
}

/* ---------- Interaktion: Swipe & Drag ---------- */
function bindSwipe() {
  var el = document.getElementById('ccard'); if (!el) return;
  var x0 = null, y0 = null;
  el.addEventListener('pointerdown', function (e) { x0 = e.clientX; y0 = e.clientY; });
  el.addEventListener('pointerup', function (e) {
    if (x0 == null) return; var dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) car(dx < 0 ? 1 : -1);
  });
}
function car(d) { var n = available().length; if (n < 2) return; ui.ci = ((ui.ci || 0) + d + n) % n; ui.anim = true; render(); }
function bindChal() {
  var c = caseById(run.id), ch = c.challenge;
  if (ch.type === 'slider') {
    var sl = document.getElementById('sl'), sv = document.getElementById('sv');
    if (sl) sl.addEventListener('input', function () { ui.ch.v = Number(sl.value); sv.textContent = fmt(sl.value, ch); });
  }
  if (ch.type === 'sort' && !ui.ch.done) {
    app.querySelectorAll('[data-pool]').forEach(function (n) {
      var sx, sy, ghost = null, k = Number(n.getAttribute('data-k'));
      n.addEventListener('pointerdown', function (e) { sx = e.clientX; sy = e.clientY; n.setPointerCapture(e.pointerId); });
      n.addEventListener('pointermove', function (e) {
        if (sx == null) return;
        if (!ghost && Math.hypot(e.clientX - sx, e.clientY - sy) > 8) { ghost = n.cloneNode(true); ghost.classList.add('ghost'); ghost.classList.remove('sel'); document.body.appendChild(ghost); n.style.opacity = '.35'; }
        if (ghost) { ghost.style.left = (e.clientX - 80) + 'px'; ghost.style.top = (e.clientY - 24) + 'px'; }
      });
      n.addEventListener('pointerup', function (e) {
        if (sx == null) return; sx = null;
        if (ghost) {
          ghost.remove(); ghost = null; n.style.opacity = '';
          var t = document.elementFromPoint(e.clientX, e.clientY), b = t && t.closest('[data-bin]');
          if (b) { ui.ch.place[k] = b.getAttribute('data-bin'); ui.ch.sel = null; }
          render();
        } else { ui.ch.sel = ui.ch.sel === k ? null : k; render(); }
      });
      n.addEventListener('pointercancel', function () { sx = null; if (ghost) { ghost.remove(); ghost = null; n.style.opacity = ''; } });
    });
  }
}

/* ---------- Klicks ---------- */
app.addEventListener('click', function (e) {
  var pn = e.target.closest('[data-pool]');
  if (pn && e.detail === 0 && ui.ch) { var pk = Number(pn.getAttribute('data-k')); ui.ch.sel = ui.ch.sel === pk ? null : pk; render(); return; }
  var t = e.target.closest('[data-a]'); if (!t || t.disabled) return;
  var a = t.getAttribute('data-a');
  var A = {
    start: function () { if (st.tut) go('hub'); else go('tut', { step: 0 }); },
    go: function () { var to = t.getAttribute('data-to'); if (to === 'mentor' || to === 'akten') { st.streak = 0; save(); } go(to); },
    'tut-next': function () {
      var inp = document.getElementById('tut-name'); if (inp) st.name = inp.value.slice(0, 16);
      if (ui.step === 4) { st.tut = true; if (st.snips.indexOf('basis-cent') < 0) st.snips.push('basis-cent'); save(); go('hub'); return; }
      save(); go('tut', { step: ui.step + 1 });
    },
    'tut-back': function () { var inp = document.getElementById('tut-name'); if (inp) st.name = inp.value.slice(0, 16); go('tut', { step: Math.max(0, ui.step - 1) }); },
    av: function () { var inp = document.getElementById('tut-name') || document.getElementById('pf-name'); if (inp) st.name = inp.value.slice(0, 16); st.av = Number(t.getAttribute('data-i')); save(); render(); },
    age: function () { st.age = Number(t.getAttribute('data-i')); save(); render(); },
    know: function () { st.know = Number(t.getAttribute('data-i')); save(); render(); },
    car: function () { car(Number(t.getAttribute('data-d'))); },
    dot: function () { ui.ci = Number(t.getAttribute('data-i')); ui.anim = true; render(); },
    open: function () { startCase(t.getAttribute('data-id')); },
    pick: function () { pick(Number(t.getAttribute('data-k'))); },
    exit: function () { ov('<div class="panel dlg" role="dialog" aria-label="Fall abbrechen"><span class="h2">Fall abbrechen?</span><p style="margin:0;font-size:14px;font-weight:700;line-height:1.45">Du kannst den Fall später nochmal von vorne starten.</p><div style="display:flex;gap:8px"><button class="btn light" style="flex:1" data-a="close">Weiterspielen</button><button class="btn" style="flex:1;font-size:16px" data-a="abort">Abbrechen</button></div></div>', true); },
    abort: function () { run = null; go('hub'); },
    sheet: function () { sheetSnips(); },
    close: function () { closeOv(); },
    place: function () { if (ui.ch.sel != null) { ui.ch.place[ui.ch.sel] = t.getAttribute('data-bin'); ui.ch.sel = null; render(); } },
    unplace: function () { if (ui.ch.sel != null) { var bb = t.closest('[data-bin]'); ui.ch.place[ui.ch.sel] = bb.getAttribute('data-bin'); ui.ch.sel = null; } else delete ui.ch.place[Number(t.getAttribute('data-k'))]; render(); },
    flag: function () { var k = t.getAttribute('data-k'); ui.ch.flags[k] = !ui.ch.flags[k]; render(); },
    nudge: function () { var ch = caseById(run.id).challenge; ui.ch.v = Math.max(ch.min, Math.min(ch.max, Number(ui.ch.v) + Number(t.getAttribute('data-d')) * ch.step)); render(); },
    submit: function () { ui.ch.done = true; render(); var sc = app.querySelector('.scroll'); if (sc) sc.scrollTop = sc.scrollHeight; },
    'to-out': function () { var g = grade(); finish(g.stage, { tip: 'In der Challenge: ' + g.line, line: g.line }); },
    after: function () {
      var lv = level();
      if (lv > st.lvlSeen) { go('lvl', { lv: lv, pick: null }); return; }
      go('hub');
    },
    lamp: function () { ui.pick = t.getAttribute('data-id'); render(); },
    'lvl-ok': function () { if (ui.lv === 1 && ui.pick) st.lamp = ui.pick; st.lvlSeen = ui.lv; save(); if (level() > st.lvlSeen) go('lvl', { lv: st.lvlSeen + 1, pick: null }); else go('hub'); },
    train: function () { go('train', { t: t.getAttribute('data-t'), ans: null }); },
    answer: function () { ui.ans = Number(t.getAttribute('data-i')); if (st.trains.indexOf(ui.t) < 0) st.trains.push(ui.t); save(); render(); },
    file: function () { ui.f = t.getAttribute('data-id'); render(); },
    sfilter: function () { ui.f = t.getAttribute('data-f'); render(); },
    stab: function () { ui.tab = t.getAttribute('data-v'); render(); },
    grp: function () { ui.g = t.getAttribute('data-g'); render(); },
    'pf-save': function () { var inp = document.getElementById('pf-name'); st.name = inp.value.slice(0, 16); save(); render(); toast('Gespeichert'); },
    reset: function () { ui.confirm = true; render(); },
    'reset-no': function () { ui.confirm = false; render(); },
    'reset-yes': function () { st = fresh(); save(); run = null; go('start'); toast('Spielstand zurückgesetzt'); }
  };
  if (A[a]) A[a]();
});
app.addEventListener('input', function (e) { if (e.target.id === 'tut-name') { st.name = e.target.value.slice(0, 16); save(); } });
app.addEventListener('keydown', function (e) { if (e.key === 'Escape' && document.getElementById('ov')) closeOv(); });

/* ---------- Start ---------- */
load();
fetch('content.json').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (data) {
  C = data; render();
}).catch(function () {
  app.innerHTML = '<div class="screen pad" style="justify-content:center;gap:12px"><h1 class="h2">Die Inhalte konnten nicht geladen werden.</h1><p class="sub">Bitte die Seite neu laden. Wenn das nicht hilft, ist die Datei content.json nicht erreichbar.</p></div>';
});
})();
</script>
